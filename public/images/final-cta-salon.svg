<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder salon interior — swap for real Blush N Curls branch photography">
  <defs>
    <linearGradient id="bgCta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF3E9" />
      <stop offset="55%" stop-color="#F3DFC4" />
      <stop offset="100%" stop-color="#E7C89C" />
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF1E3" />
      <stop offset="100%" stop-color="#EFDCC4" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="4%" r="60%">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="counter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8CFA0" />
      <stop offset="100%" stop-color="#B08038" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93A374" />
      <stop offset="100%" stop-color="#5C6B45" />
    </linearGradient>
    <filter id="softCta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="softerCta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55" />
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#bgCta)" />

  <!-- bright back wall panel -->
  <rect x="0" y="0" width="900" height="770" fill="url(#wall)" />
  <rect width="900" height="1200" fill="url(#spotlight)" />

  <!-- soft warm ambient glows -->
  <circle cx="160" cy="190" r="210" fill="#E8CFA0" opacity="0.4" filter="url(#softerCta)" />
  <circle cx="740" cy="980" r="240" fill="#B85078" opacity="0.1" filter="url(#softerCta)" />

  <!-- reception counter -->
  <rect x="0" y="760" width="900" height="18" fill="url(#counter)" />
  <rect x="0" y="778" width="900" height="422" fill="#F4E6D2" />

  <!-- nameplate panel behind counter, evokes signage without literal text -->
  <rect x="60" y="655" width="270" height="72" rx="8" fill="none" stroke="#B08038" stroke-opacity="0.5" stroke-width="1.5" />
  <g transform="translate(195,691)" stroke="#96702E" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M -78 0 h 44" stroke-opacity="0.45" />
    <path d="M 34 0 h 44" stroke-opacity="0.45" />
    <circle cx="0" cy="0" r="17" stroke-opacity="0.9" />
    <path d="M -6.5 0 C -6.5 -11, 6.5 -11, 6.5 0 C 6.5 6.5, 2 9.5, -2.5 6.5" stroke-opacity="0.9" />
  </g>

  <!-- pendant lights, warm glow -->
  <g stroke="#B08038" stroke-width="1.5" opacity="0.3">
    <line x1="200" y1="0" x2="200" y2="230" />
    <line x1="450" y1="0" x2="450" y2="270" />
    <line x1="700" y1="0" x2="700" y2="210" />
  </g>
  <circle cx="200" cy="240" r="16" fill="#FFF8EA" opacity="0.95" filter="url(#softCta)" />
  <circle cx="450" cy="280" r="16" fill="#FFF8EA" opacity="0.95" filter="url(#softCta)" />
  <circle cx="700" cy="220" r="16" fill="#FFF8EA" opacity="0.95" filter="url(#softCta)" />

  <!-- potted plant, bottom right -->
  <g filter="url(#softCta)" opacity="0.9">
    <path d="M 780 1200 C 760 1000, 820 900, 900 860 L 900 1200 Z" fill="url(#leaf)" />
    <path d="M 700 1200 C 690 1050, 730 950, 800 900 C 770 1000, 760 1120, 760 1200 Z" fill="url(#leaf)" opacity="0.8" />
  </g>
  <path d="M 810 1140 L 890 1140 L 878 1200 L 822 1200 Z" fill="#C98F73" opacity="0.55" />

  <!-- small potted plant, left foreground -->
  <g filter="url(#softCta)" opacity="0.85">
    <path d="M 40 1200 C 20 1080, 60 1010, 120 990 C 100 1060, 95 1140, 100 1200 Z" fill="url(#leaf)" />
  </g>

  <!-- soft floor line -->
  <rect x="0" y="1194" width="900" height="6" fill="#B08038" opacity="0.18" />

  <rect width="900" height="1200" fill="url(#bgCta)" opacity="0.04" />
</svg>
